# Render Blueprint: API (Docker) + managed PostgreSQL. Frontend is deployed separately on Vercel.
databases:
  - name: cmrs-db
    plan: free
    databaseName: cmrs
    user: cmrs

services:
  - type: web
    name: cmrs-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /healthz
    # Migrations and seeding run at container start (see backend/Dockerfile): pre-deploy commands need a paid plan.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cmrs-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SETTLEMENT_DELAY_DAYS
        value: "2"
