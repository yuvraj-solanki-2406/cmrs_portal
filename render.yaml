# Render Blueprint: API (Docker) + managed PostgreSQL. Frontend is deployed separately on Vercel.
databases:
  - name: cmrs-db
    plan: free
    databaseName: cmrs
    user: cmrs

services:
  - type: web
    name: cmrs-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /healthz
    # Runs on every release, before traffic switches. Both commands are idempotent.
    preDeployCommand: python manage.py migrate --noinput && python manage.py seed_demo --users-only
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cmrs-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SETTLEMENT_DELAY_DAYS
        value: "2"
