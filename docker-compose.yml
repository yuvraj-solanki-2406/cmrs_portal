services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cmrs
      POSTGRES_USER: cmrs
      POSTGRES_PASSWORD: cmrs
    ports:
      - "5433:5432"
    volumes:
      - cmrs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmrs -d cmrs"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

volumes:
  cmrs_pgdata:
